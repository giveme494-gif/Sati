name: Build Sati Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build installable Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sati source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Java for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build installable Android debug APK
        run: |
          chmod +x android/gradlew
          android/gradlew --no-daemon -p android :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sati-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
